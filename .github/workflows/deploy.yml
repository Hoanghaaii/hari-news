# Đổi tên để phản ánh đúng nhiệm vụ là CI (Tích hợp liên tục)
name: CI - Build and Push Backend Image

on:
  push:
    branches:
      - main

jobs:
  # Đổi tên job từ 'deploy' thành 'build_and_push' cho rõ ràng
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Docker Image (with version)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            hoanghaaii/hari-news:latest
            hoanghaaii/hari-news:${{ env.SHORT_SHA }}

      # ---- ĐÃ XÓA BƯỚC DEPLOY BẰNG SSH Ở ĐÂY ----
